  content: "I will present [GeoDiffuser](https://ivl.cs.brown.edu/research/geodiffuser.html), a method to perform geometry-based image editing with T2I diffusion models at [NYC Computer Vision Day](https://cs.nyu.edu/~fouhey/NYCVision2024/). Our work does not need any training or model fine-tuning!"
