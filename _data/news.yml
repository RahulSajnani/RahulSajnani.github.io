  featured: true
  content: "Our work [GeoDiffuser](https://ivl.cs.brown.edu/research/geodiffuser.html) is accepted to [WACV 2025](https://wacv2025.thecvf.com/) :tada:! See you in Arizona! We perform geometry-based image editing with T2I diffusion models without any training or model / fine-tuning."
