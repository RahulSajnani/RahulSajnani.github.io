- title: Experience
  type: time_table
  contents:
    - title: Applied Scientist II Intern
      institution: Amazon Robotics, North Reading, MA
      year: Jun 2024 - Jan 2026
      description:
        - "Led the UniWALM project — a unified world-action-language model for memory-dependent robot manipulation. Mixture-of-Transformers (Wan2.2 video backbone + action DiT + discrete-diffusion language expert) co-generates future video, robot action, and natural-language memory in a single parallel diffusion pass."
        - "Real-world memory-dependent manipulation: 11.1% → 61.1% vs same-backbone FastWAM; 34.5% on RMBench, beating Mem-0's privileged-keyframe setup (28.5%) without pretrained VLMs."
        - "Designed bimanual and memory-dependent data-collection pipelines (Shadow Hand, Franka Panda, AgileX dual-arm in sim); authored unified-WAM design docs adopted cross-team."
        - "Managers: Jeroen Vanbaar, Jose Barreiros, Manikantan Nambi."
    - title: Research Scientist Intern
      institution: Adobe Research, San Jose, CA
      year: May 2025 - Aug 2025
      description:
        - "Developed AppearancePointers — a FLUX-based model for multimodal multi-region control where each output region is independently steered by text, reference image, or material texture in a single denoising pass."
        - "State-of-the-art on three multi-region fidelity metrics, beating DreamRenderer and MSDiffusion at substantially larger scale."
        - "Curated the AP-37K multimodal dataset."
        - "Advisors: Matheus Gadelha, Radomír Měch."
    - title: Graduate Researcher
      institution: Brown Visual Computing (IVL), Brown University
      year: Sep 2022 - Present
      description:
        - "3D structure for perception & generation: SO(3)-equivariant pose on partial point clouds (ConDor, CVPR 2022) and NeRFs (Cafi-Net, CVPR 2023 Highlight); regularity-aware scene rearrangement (LEGO-Net, CVPR 2023)."
        - "GeoDiffuser — training-free geometry-based image editing with diffusion models (WACV 2025, Best Student Paper, invited talk)."
        - "Currently: feed-forward 3D Gaussian Splatting from a single monocular video by distilling video-diffusion backbones (Wan2.1, LTX-Video, CogVideoX)."
        - "Advisors: Prof. Srinath Sridhar and Prof. Leonidas Guibas (Stanford)."
    - title: Undergraduate / M.Sc. Researcher
      institution: Robotics Research Center (RRC), IIIT Hyderabad
      year: Aug 2019 - May 2022
      description:
        - "Designed the full self-driving perception stack of the RRC autonomous vehicle platform."
        - "DRACO — weakly-supervised dense pose canonicalization (IEEE ICRA 2021)."
        - "Multi-object monocular SLAM for dynamic driving scenes (IEEE IV 2020)."
        - "BirdSLAM — monocular multibody SLAM in bird's-eye view (VISIGRAPP 2021)."
